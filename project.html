<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>memory tag</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: #ffffff;
  font-family: 'KoPubWorld', serif;
}

#viewport {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  position: relative;
  perspective: 2000px;
  cursor: grab;
}

#canvas {
  position: absolute;
  transform-style: preserve-3d;
  transform-origin: 0 0;
  transition: transform 0.08s linear;
}

.card {
  position: absolute;
  transition: transform 0.08s linear;
  cursor: grab;
  user-select: none;
  white-space: pre-line;
}

.card.dragging {
  cursor: grabbing;
  transition: none;
  animation-play-state: paused;
}

.card.selected {
  z-index: 999999 !important;
}

.card img {
  display: block;
  margin-bottom: 6px;
  width: 100%;
  height: auto;
  filter: grayscale(100%);
  pointer-events: none;
}

.card p {
  font-size: 12px;
  color: #222;
  line-height: 1.6;
  letter-spacing: -0.1px;
  margin-left: 6px;
  white-space: pre-line;
  pointer-events: none;
}

.card:hover {
  z-index: 999;
}

.zoom-controls {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9999999;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.zoom-controls button {
  width: 52px;
  height: 52px;
  border: none;
  border-radius: 100px;
  background: rgba(255,255,255,0.94);
  font-size: 22px;
  cursor: pointer;
}

.zoom-controls button:hover {
  background: rgba(245,245,245,0.98);
}

@keyframes floatInner {
  0% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
  100% {
    transform: translateY(0);
  }
}

.float-inner {
  will-change: transform;
}

.card.dragging .float-inner {
  animation-play-state: paused;
}

</style>
</head>

<body>

<div id="viewport">
  <div id="canvas"></div>
</div>

<div class="zoom-controls">
  <button id="zoomIn">＋</button>

</div>

let isIndexOnly = false;
let selectedCard = null;
let frontZ = 10000;

let dragCard = null;
let dragStartMouseX = 0;
let dragStartMouseY = 0;
let dragStartLeft = 0;
let dragStartTop = 0;

let isPanning = false;
let panStartX = 0;
let panStartY = 0;
let panOriginX = 0;
let panOriginY = 0;

const allCardImages = [];
const allCardTexts = [];
const zoomStep = 0.25;


function createCards() {
 
  const colors = [
    "#57ffa7", "#dddddd", "#ff57df", "#ccdbff", "#e1a9ff"
  ];
  
  for (let i = 0; i < 300; i++) {
    const index = i % images.length;

    const card = document.createElement("div");
    card.className = "card";

    const depth = Math.random() * 800 - 400;
    const scaleValue = 0.6 + Math.random() * 0.8;
    const baseTransform = `translateZ(${depth}px) scale(${scaleValue})`;
    card.dataset.baseTransform = baseTransform;
    card.style.transform = baseTransform;

    const imgWidth = 160 + Math.random() * 200;
    card.style.width = imgWidth + "px";

    const content = document.createElement("div");
    content.style.position = "relative";

    content.className = "float-inner";

    const img = document.createElement("img");
    img.src = images[index];

    img.onerror = () => {
      console.log("이미지 없음:", images[index]);
      card.remove();
    };

    const text = document.createElement("p");
    text.innerText = texts[index] || "";

    allCardImages.push(img);
    allCardTexts.push(text);

    const indexFrame = document.createElement("div");

    const color = colors[Math.floor(Math.random() * colors.length)];
    const thickness = Math.floor(Math.random() * 18) + 14;

    content.style.paddingLeft = (thickness - 2) + "px";

    indexFrame.style.position = "absolute";
    indexFrame.style.left = "0";
    indexFrame.style.top = "0";
    indexFrame.style.width = thickness + "px";
    indexFrame.style.height = "100%";
    indexFrame.style.background = color;
    indexFrame.style.transform = "translateX(-2px)";
    indexFrame.style.zIndex = 2;

    indexFrame.addEventListener("pointerdown", (e) => {
      e.stopPropagation();

      isIndexOnly = !isIndexOnly;

      allCardImages.forEach(el => {
        el.style.opacity = isIndexOnly ? "0" : "1";
      });

      allCardTexts.forEach(el => {
        el.style.opacity = isIndexOnly ? "0" : "1";
      });
    });

    card.addEventListener("pointerdown", (e) => {
      if (e.target === indexFrame) return;
      e.stopPropagation();

      dragCard = card;
      dragStartMouseX = e.clientX;
      dragStartMouseY = e.clientY;
      dragStartLeft = parseFloat(card.style.left) || 0;
      dragStartTop = parseFloat(card.style.top) || 0;

      card.classList.add("dragging");
      bringToFront(card);
    });

    content.appendChild(indexFrame);
    content.appendChild(img);
    content.appendChild(text);
    card.appendChild(content);

    const cols = 20;
    const spacingX = 400;
    const spacingY = 300;

    const col = i % cols;
    const row = Math.floor(i / cols);

    const jitterX = (Math.random() - 0.5) * 150;
    const jitterY = (Math.random() - 0.5) * 150;

    card.style.left = col * spacingX + jitterX + "px";
    card.style.top = row * spacingY + jitterY + "px";

    canvas.appendChild(card);
  }
}

function bringToFront(card) {
  if (selectedCard && selectedCard !== card) {
    selectedCard.classList.remove("selected");
    selectedCard.style.transform = selectedCard.dataset.baseTransform;
  }

  selectedCard = card;
  selectedCard.classList.add("selected");
  selectedCard.style.zIndex = ++frontZ;
  selectedCard.style.transform =
    `${selectedCard.dataset.baseTransform} translateZ(240px) scale(1.03)`;

  canvas.appendChild(selectedCard);
}

createCards();

requestAnimationFrame(() => {
  fitViewToCards();
});

window.addEventListener("load", () => {
  fitViewToCards();
});

let scale = 1;
let pos = { x: 0, y: 0 };

viewport.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".card")) return;

  isPanning = true;
  panStartX = e.clientX;
  panStartY = e.clientY;
  panOriginX = pos.x;
  panOriginY = pos.y;

  viewport.style.cursor = "grabbing";
});

viewport.addEventListener("wheel", (e) => {
  e.preventDefault();

  const zoom = e.deltaY * -0.002;
  scale += zoom;
  scale = Math.min(Math.max(0.1, scale), 4);

  updateTransform();
});

window.addEventListener("pointermove", (e) => {
  if (dragCard) {
    const dx = (e.clientX - dragStartMouseX) / scale;
    const dy = (e.clientY - dragStartMouseY) / scale;

    dragCard.style.left = `${dragStartLeft + dx}px`;
    dragCard.style.top = `${dragStartTop + dy}px`;
    return;
  }

  if (isPanning) {
    const dx = e.clientX - panStartX;
    const dy = e.clientY - panStartY;

    pos.x = panOriginX + dx;
    pos.y = panOriginY + dy;
    updateTransform();
  }
});

window.addEventListener("pointerup", () => {
  if (dragCard) {
    dragCard.classList.remove("dragging");
  }

  dragCard = null;
  isPanning = false;
  viewport.style.cursor = "grab";
});

function fitViewToCards() {
  const cards = Array.from(document.querySelectorAll(".card"));
  if (!cards.length) return;

  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;

  cards.forEach(card => {
    const left = parseFloat(card.style.left) || 0;
    const top = parseFloat(card.style.top) || 0;
    const width = card.offsetWidth || 0;
    const height = card.offsetHeight || 0;

    minX = Math.min(minX, left);
    minY = Math.min(minY, top);
    maxX = Math.max(maxX, left + width);
    maxY = Math.max(maxY, top + height);
  });

  const contentWidth = maxX - minX;
  const contentHeight = maxY - minY;

  const padding = 260; // 화면 안쪽 여백
  const scaleX = (window.innerWidth - padding * 2) / contentWidth;
  const scaleY = (window.innerHeight - padding * 2) / contentHeight;

  // 가장 멀리서 전체가 보이도록
  scale = Math.min(scaleX, scaleY);

  // 너무 과하게 작거나 크게 되는 것 방지
  scale = Math.min(Math.max(scale, 0.08), 1);

  // 중앙 정렬
  pos.x = (window.innerWidth - contentWidth * scale) / 2 - minX * scale;
  pos.y = (window.innerHeight - contentHeight * scale) / 2 - minY * scale;

  updateTransform();
}

function updateTransform() {
  canvas.style.transform =
    `translate(${pos.x}px, ${pos.y}px) scale(${scale})`;
}

function zoomAtCenter(delta) {
  const oldScale = scale;
  const newScale = Math.min(Math.max(oldScale + delta, 0.1), 4);

  if (newScale === oldScale) return;

  // 🔥 화면 중앙 기준
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  const worldX = (centerX - pos.x) / oldScale;
  const worldY = (centerY - pos.y) / oldScale;

  scale = newScale;

  pos.x = centerX - worldX * newScale;
  pos.y = centerY - worldY * newScale;

  updateTransform();
}

zoomInBtn.addEventListener("click", () => {
  zoomAtCenter(zoomStep);
});

zoomOutBtn.addEventListener("click", () => {
  zoomAtCenter(-zoomStep);
});

zoomOutBtn.addEventListener("click", (e) => {
  const x = e.clientX || (window.innerWidth - 50);
  const y = e.clientY || (window.innerHeight - 140);
  zoomAtPoint(-zoomStep, x, y);
});

updateTransform();
</script>
